[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# Repo root has many sibling dirs (dashboard, scripts, …). Pin discovery so
# `pip install -e .` does not abort with "Multiple top-level packages discovered".
[tool.setuptools.packages.find]
where = ["."]
include = ["tradingagents*", "server*"]
namespaces = true

[project]
name = "tradingagents"
version = "0.1.0"
description = "EGX Multi-Agent AI Trading System — LLM-powered stock analysis for the Egyptian Exchange"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "backtrader>=1.9.78.123",
    "chromadb>=1.0.12",
    "diskcache>=5.6.0",
    "eodhd>=1.0.32",
    "fastapi>=0.115.0",
    "feedparser>=6.0.11",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=2.1.5",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    # Imported directly by tradingagents/portfolio/schemas.py (and the wider
    # agent schemas). Pinned explicitly so a langchain bump can't silently move
    # the schema library out from under the contract layer.
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pytz>=2025.2",
    "questionary>=2.1.0",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "stockstats>=0.6.5",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "uvicorn>=0.30.0",
    "vaderSentiment>=3.3.2",
    "yfinance>=0.2.63",
]

[project.optional-dependencies]
# Postgres + pgvector backend for agent memory and audit/backtest persistence.
# Required only when TRADINGAGENTS_MEMORY_BACKEND=postgres or when running the
# audit/backtest writers (PR 5/6). Default (chroma) install does not need these.
postgres = [
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.0",
]

# Portfolio Optimization Assistant subsystem (design v3). Numeric/solver stack
# for the deterministic core (analytics + optimizer). Kept as an extra because
# cvxpy is heavyweight and the optimizer fails closed to a scipy/heuristic path
# when it is absent, so the base install never breaks on a cvxpy wheel issue.
# scipy / scikit-learn are usually already present transitively; declared here so
# the subsystem's requirements are explicit and self-contained.
portfolio = [
    "cvxpy>=1.5",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

# Tooling for the test suite (e.g. the P4 WebSocket smoke client, coverage runs).
# Not required at runtime.
dev = [
    "websockets>=12.0",
    "coverage>=7.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that make real LLM API calls (deselect with '-m not integration')",
    "live: marks optional tests that call live external providers (deselect with '-m not live')",
]
